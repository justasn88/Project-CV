spring:
  application:
    name: JobCheckerApplication
  datasource:
    url: jdbc:postgresql://localhost:5433/job_checker_db
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate.jdbc.batch_size: 50
      hibernate.order_inserts: true
  sql:
    init:
      mode: always